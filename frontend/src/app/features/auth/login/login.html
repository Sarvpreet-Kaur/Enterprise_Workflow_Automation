<div class="login-page">

  <div class="background-shape shape-1"></div>
  <div class="background-shape shape-2"></div>

  <div class="login-card">

    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Sign in to continue to Enterprise Workflow Portal</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Email Address</label>

        <input type="email" formControlName="emailId" placeholder="Enter your email">

        @if(loginForm.get('emailId')?.touched &&
        loginForm.get('emailId')?.invalid){
        <small class="error">
          Email is required.
        </small>
        }
      </div>

      <div class="form-group">

        <label>Password</label>

        <input type="password" formControlName="password" placeholder="Enter your password">

        @if(loginForm.get('password')?.touched &&
        loginForm.get('password')?.invalid){
        <small class="error">
          Password must be at least 6 characters.
        </small>
        }

      </div>

      <button class="login-btn" type="submit" [disabled]="loginForm.invalid">

        Login

      </button>

    </form>

  </div>

</div>
