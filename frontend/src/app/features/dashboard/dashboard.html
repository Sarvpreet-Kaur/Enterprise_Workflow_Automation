<section class="welcome-section">
  <div class="welcome-left">

    <h1 class="page-title">

      Welcome back,
      <span>{{ user?.firstName }} {{ user?.lastName }}</span>

    </h1>

    <p class="page-subtitle">

      Here's an overview of your workflow activity today.

    </p>

  </div>

  <div class="welcome-right">

    <div class="current-date">

      {{ currentDate | date:'EEEE, dd MMMM yyyy' }}

    </div>

  </div>

</section>

<div class="stats-grid">

  @for(card of cards; track card.title){

  <app-stat-card [title]="card.title" [value]="card.value" [icon]="card.icon">
  </app-stat-card>

  }

</div>

<section class="dashboard-content">

  <app-recent-requests [requests]="dashboard.recentRequests">
  </app-recent-requests>

  @if(role === 'manager'){

  <app-pending-approvals [approvals]="dashboard.pendingApprovals?.requests ?? []">
  </app-pending-approvals>

  }

  @if(role === 'admin'){

  <app-system-overview [system]="dashboard.system!">
  </app-system-overview>

  }

</section>
