@for(filter of filters(); track filter.key){

    <mat-form-field appearance="outline">

        <mat-label>

            {{filter.label}}

        </mat-label>

        <mat-select
            (selectionChange)="onChange(filter.key,$event.value)">

            @for(option of filter.options; track option.value){

                <mat-option
                    [value]="option.value">

                    {{option.label}}

                </mat-option>

            }

        </mat-select>

    </mat-form-field>

}
